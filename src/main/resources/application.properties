server.port=8083
server.address=172.20.10.4

# JWT Properties
jwt.secret=MinhaChaveSecretaSuperLongaEDificilDeAdivinharParaProtegerMeusTokensJWT
jwt.expiration=86400000

# ===============================================
#  CONFIGURAï¿½ï¿½O DO BANCO DE DADOS H2 (EM MEMï¿½RIA)
# ===============================================

# Habilita o console web do H2
spring.h2.console.enabled=true
spring.h2.console.web-allow-others=true

# Define o caminho para acessar o console (ex: http://localhost:8081/h2-console)
spring.h2.console.path=/h2-console

# URL de conexao para um banco em memoria chamado 'smartdb'
spring.datasource.url=jdbc:h2:mem:smartdb
# Driver do H2
spring.datasource.driverClassName=org.h2.Driver
# Usuario padrap do H2
spring.datasource.username=sa
# Senha padrao do H2 (vazia)
spring.datasource.password=

# ===============================================
#  CONFIGURAÇÃO DO JPA/HIBERNATE
# ===============================================

# Dialeto para o Hibernate se comunicar com o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# (Recomendado para desenvolvimento)
# Cria ou atualiza o schema do banco de dados automaticamente com base nas suas @Entity
spring.jpa.hibernate.ddl-auto=update